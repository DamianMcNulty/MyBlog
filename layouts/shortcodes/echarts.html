{{ $id := .Page.Scratch.Get "echarts_id" | default 0 }}
{{ $id = add $id 1 }}
{{ .Page.Scratch.Set "echarts_id" $id }}
{{ $chartId := printf "echarts-%d" $id }}
{{ $option := .Inner | default "{}" }}

<!-- Load Apache ECharts Library via CDN -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<div id="{{ $chartId }}" style="width: 100%; height: 400px; margin: 20px 0;"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var chartDom = document.getElementById('{{ $chartId }}');
    if (!chartDom) {
      return;
    }

    var myChart = echarts.init(chartDom);
    var option = {{ $option | safeJS }};
    myChart.setOption(option);

    // Make chart responsive to window resizing
    window.addEventListener('resize', function resizeChart() {
      myChart.resize();
    });
  });
</script>
