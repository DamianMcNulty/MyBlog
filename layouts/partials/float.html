{{ if not .Site.Params.hideColorSchemeToggle }}
<div class="float-container">
    <button id="appearance-toggle" class="appearance-toggle" type="button" aria-controls="appearance-picker" aria-expanded="false" aria-label="Open appearance settings" title="Appearance">
        <span class="appearance-wheel" aria-hidden="true"></span>
    </button>

    <div id="appearance-picker" class="appearance-picker" hidden>
        <p class="appearance-title">Appearance</p>
        <div class="appearance-mode-section">
            <p class="appearance-section-label">Display mode</p>
            <div class="appearance-mode-options" role="group" aria-label="Display mode">
                <button class="appearance-mode-button" type="button" data-appearance-mode="auto" aria-pressed="false">Auto</button>
                <button class="appearance-mode-button" type="button" data-appearance-mode="light" aria-pressed="false">Light</button>
                <button class="appearance-mode-button" type="button" data-appearance-mode="dark" aria-pressed="false">Dark</button>
            </div>
        </div>
        <p class="appearance-section-label">Background colour</p>
        <label class="background-colour-control" for="background-colour-input">
            <span class="background-colour-wheel-large" aria-hidden="true"></span>
            <span>Choose a background tone</span>
        </label>
        <input id="background-colour-input" type="color" value="#F6F4EF" aria-describedby="background-colour-help">
        <p id="background-colour-help" class="background-colour-help">Colours are softened for readability while keeping the selected tone visible.</p>
        <div class="background-colour-previews" aria-label="Colour previews">
            <span class="background-colour-preview"><i id="background-light-preview" aria-hidden="true"></i>Light background</span>
            <span class="background-colour-preview"><i id="background-dark-preview" aria-hidden="true"></i>Dark background</span>
        </div>
        <button id="background-colour-reset" class="background-colour-reset" type="button">Reset background colour</button>
    </div>
</div>
{{ end }}
